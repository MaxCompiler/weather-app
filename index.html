<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather.app</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Mi Weather App</h1>
        <div class="search-box">
            <label for="searchInput">Ingresar la ciudad: </label>
            <input type="text" name="ciudad" id="searchInput" placeholder="Ingresar tu ciudad" autocomplete="off">
            <button id="searchBtn">Buscar</button>
        </div>
        <div class="weather-info" id="weatherInfo"></div>

        <div class="history">
            <h2>Busquedad Reciente: </h2>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
